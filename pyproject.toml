[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "rest-framework", "django", "first-party", "local-folder"]
known-first-party = ["apps", "settings"]

[tool.ruff.lint.isort.sections]
rest-framework = ["rest_framework", "rest_framework_simplejwt"]
django = ["django"]
